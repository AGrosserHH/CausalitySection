name: aitiolin checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ''
      DJANGO_SECRET_KEY: 'ci-test-only-not-a-deployment-secret'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: aitiolin/causalproject/requirements.txt
      - run: pip install -r aitiolin/causalproject/requirements.txt
      - run: python scripts/check_prototype_language.py && python scripts/check_aitiolin_version.py && python scripts/check_release_contents.py
      - working-directory: aitiolin/causalproject
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test causal_app --noinput
      - run: pip freeze > backend-tested-environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-tested-environment
          path: backend-tested-environment.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aitiolin/causal-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aitiolin/causal-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
