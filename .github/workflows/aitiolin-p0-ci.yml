name: aitiolin checks and draft prerelease
on:
  pull_request:
  push:
    branches: [main]
    tags: ['aitiolin-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ''
      DJANGO_SECRET_KEY: 'ci-only-not-a-deployment-secret'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: aitiolin/causalproject/requirements.txt
      - run: pip install -r aitiolin/causalproject/requirements.txt
      - run: python scripts/check_prototype_language.py && python scripts/check_aitiolin_version.py && python scripts/check_release_contents.py
      - working-directory: aitiolin/causalproject
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test causal_app p0 --noinput
      - run: pip freeze > backend-tested-environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-tested-environment
          path: backend-tested-environment.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aitiolin/causal-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aitiolin/causal-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  draft-prerelease:
    if: startsWith(github.ref, 'refs/tags/aitiolin-v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version and build tracked-source archive
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#aitiolin-v}" = "$(cat aitiolin/VERSION)"
          git archive --format=zip --output=aitiolin-source.zip HEAD aitiolin scripts .github
      - name: Create a draft, not a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" aitiolin-source.zip --draft --prerelease --verify-tag --notes-file aitiolin/CHANGELOG.md
